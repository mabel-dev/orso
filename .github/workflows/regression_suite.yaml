---

name: Regression Suite

on:
  push:
  schedule:
    - cron: "0 4 * * *"

jobs:
  regression_matrix:
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }} x64
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Install Requirements
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pytest coverage setuptools nanobind
          python -m pip install --upgrade --pre -r $GITHUB_WORKSPACE/requirements.txt
          python setup.py build_ext --inplace

      # The native layer is built on headers copied from opteryx-core (DESIGN.md §3).
      # A copy that no longer matches native/draken/SOURCE was edited by hand or
      # half-synced; either way it must not reach main.
      - name: Verify vendored draken headers
        shell: bash
        run: python tools/sync_draken.py --check

      # opteryx and polars have no wheels for the newest interpreters (opteryx 0.26.8
      # falls back to an sdist that does not build on 3.14). They only back optional
      # integration tests, which pytest.importorskip skips when they are absent. Install
      # one requirement at a time: a single `pip install -r` is all-or-nothing, so one
      # unbuildable package would also leave out numpy, pandas and the rest.
      - name: Install Test Requirements (each best effort)
        shell: bash
        run: |
          grep -vE '^\s*(#|$)' $GITHUB_WORKSPACE/tests/requirements.txt | while read -r req; do
            python -m pip install --upgrade --pre "$req" || echo "::warning::could not install $req; its tests will skip"
          done

      - name: Run Regression Tests
        shell: bash
        run: python -m coverage run -m pytest

      # Coverage is a property of the suite, not the interpreter. Only enforce it on the
      # one job where the full optional dependency set installs, otherwise the skipped
      # integration tests drag the number under the threshold on 3.14.
      - name: Check Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: bash
        run: python -m coverage report --include=orso/** --fail-under=70 -m

      - name: Show Coverage
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.11'
        shell: bash
        run: python -m coverage report --include=orso/** -m

      - name: "Upload coverage to Codecov"
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
