---

name: Release to PyPI

on:
  release:
    types: [published]
    branches:
      - 'main'

jobs:

  build-manylinux:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ubuntu-latest
    env:
      # manylinux2014 (glibc 2.17) is no longer buildable: numpy dropped
      # manylinux_2_17 wheels at 2.3.0, so pip fell back to the sdist and failed
      # against the image's GCC 10.2.1 ("NumPy requires GCC >= 10.3"). Moving to
      # glibc 2.28 loses nothing real - pyarrow and numpy are hard runtime
      # requirements of orso and both ship manylinux_2_28 only, so a glibc 2.17
      # wheel could not have been installed anyway.
      MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64
      PLAT: manylinux_2_28_x86_64
    steps:
      - name: Set up Python (runner)
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check out repository
        uses: actions/checkout@v4.1.7
        with:
          path: io

      - name: Set permissions for build.sh
        run: chmod +x io/build.sh

      - name: Build Wheels
        run: |
          set -euo pipefail

          echo "Pulling ${MANYLINUX_IMAGE}..."
          docker pull "${MANYLINUX_IMAGE}"

          echo "Building with ${MANYLINUX_IMAGE} (PLAT=${PLAT})"
          docker run --rm \
            -e PLAT="${PLAT}" \
            -e PACKAGE_NAME=orso \
            -e PYTHON_VERSION=${{ matrix.python-version }} \
            -v `pwd`:/io \
            --workdir /io \
            "${MANYLINUX_IMAGE}" \
            io/build.sh

      - name: Archive Wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.python-version }}
          path: io/dist/*manylinux*.whl
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    strategy:
      max-parallel: 4
      matrix:
        include:
          - python-version: '3.10'
          - python-version: '3.11'
          - python-version: '3.12'
          - python-version: '3.13'
          - python-version: '3.14'

    steps:
      - uses: actions/checkout@v3.5.3

      - name: Set up Python ${{ matrix.python-version }} x64
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      # setuptools is explicit: it is no longer bundled with Python 3.12+, and it used
      # to arrive here only as a transitive dependency of setuptools_rust.
      - name: Install Python package dependencies
        run: python -m pip install --upgrade pip setuptools wheel cython numpy

      - name: Build on macOS universal2
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
          MACOSX_DEPLOYMENT_TARGET: '10.15'
          ARCHFLAGS: -arch x86_64 -arch arm64
        run: python setup.py bdist_wheel

      - name: Archive dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos-${{ matrix.python-version }}
          path: dist
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - python-version: '3.10'
          - python-version: '3.11'
          - python-version: '3.12'
          - python-version: '3.13'
          - python-version: '3.14'

    steps:
      - uses: actions/checkout@v4.1.7

      # NOTE: we deliberately do NOT install the VS2019 Build Tools here any more.
      # windows-latest already ships the VS2022 (MSVC 14.3x) toolchain, which is the
      # minimum required to build C extensions for CPython 3.13+. Installing the older
      # VC 14.0/14.1 toolsets alongside it is what broke the 3.13 wheel in 0.0.219 and
      # blocked the whole release job in 0.0.233.

      - name: Set up Python ${{ matrix.python-version }} x64
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Install Python package dependencies
        run: python -m pip install --upgrade pip setuptools wheel cython numpy

      - name: Build binary wheel
        run: python setup.py bdist_wheel

      # Fatal check: the wheel must actually contain the compiled extensions and be
      # tagged for this interpreter. This is the failure we shipped blind for months --
      # a wheel that builds but has no working native code is worse than no wheel.
      - name: Verify wheel contents
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -ne 1 ]; then
            echo "expected exactly one wheel, found ${#wheels[@]}: ${wheels[*]:-none}"
            exit 1
          fi
          whl="${wheels[0]}"
          echo "built: $(basename "$whl")"
          case "$(basename "$whl")" in
            *win_amd64.whl) ;;
            *) echo "wheel is not tagged win_amd64"; exit 1 ;;
          esac
          contents=$(python -c "import zipfile,sys; print('\n'.join(zipfile.ZipFile(sys.argv[1]).namelist()))" "$whl")
          echo "$contents" | grep -E 'orso/compute/compiled\..*\.pyd$' \
            || { echo "MISSING compiled extension in wheel"; echo "$contents"; exit 1; }
          echo "$contents" | grep -E 'orso/compute/column_encodings\..*\.pyd$' \
            || { echo "MISSING column_encodings extension in wheel"; echo "$contents"; exit 1; }
          echo "both native extensions present"

      # Best-effort: needs the full runtime dependency set, which can lag behind on
      # brand-new interpreters, so don't let it block a otherwise-good wheel.
      - name: Import smoke test
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m pip install --no-index --no-deps --find-links dist orso
          # run outside the source tree so we import the installed wheel, not ./orso
          cd "$RUNNER_TEMP"
          python -c "import orso; from orso.compute.compiled import calculate_data_width; print('orso', orso.__version__, 'imported OK')"

      - name: Archive dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows-${{ matrix.python-version }}
          path: dist
          if-no-files-found: error

  upload:
    needs:
      - build-manylinux
      - build-macos
      - build-windows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3.5.3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # setuptools is not bundled with Python 3.12+; setup.py sdist needs it
          python -m pip install --upgrade setuptools cython wheel numpy
          python -m pip install --upgrade -r requirements.txt

      - name: Create source dist
        run: python setup.py sdist

      # Pull every dist-* artifact produced by the build jobs in one go. Previously
      # each wheel was staged by an individually named step, which meant a new Python
      # version needed edits in two places and a single missing artifact aborted the
      # whole publish. Each build job sets if-no-files-found: error, so a genuine build
      # failure still fails that job and blocks this one via `needs`.
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4.1.7
        with:
          pattern: dist-*
          path: staged
          merge-multiple: true

      - name: Collect wheels into dist/
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find staged -name '*.whl' -exec mv -v -t dist/ {} +
          echo "=== wheels to publish ==="
          ls -1 dist
          test -n "$(ls -1 dist/*.whl 2>/dev/null)" || { echo "no wheels staged"; exit 1; }

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
